[run]
name = "rank_stress_smoke"
master_seed = 20260809
dgps = [1]
cells = [[20, 20]]
replications = 1
chunk_size = 1
parallel_level = "none"
n_jobs = 1
blas_threads = 1
output_root = "results/mc"

[dgp]
target_r2 = 0.65
kappa_f_b = 0.15
rho_fx = 0.5
calibration_draws = 1
group_gap_pilot_draws = 1
auto_adjust_group_gap = false

[rank_stress]
true_rank_vectors = [[1, 1, 1], [2, 1, 1], [1, 0, 2]]
component_strengths = [1.0, 1.0]

[estimation]
rank_caps = [3, 3, 3]
larger_rank_caps = [4, 4, 4]
spatial_dimension = 1
eta_for_penalty = 4.0
coefficient_bound = 10.0
simulation_interior_margin = 1.0
max_sweeps = 300
objective_rtol = 1e-5
stationarity_tol = 0.05
start_objective_stability_tol = 1e-5
nuclear_gamma = 0.8
nuclear_epsilon = 0.01
nuclear_max_iter = 40
nuclear_tol = 1e-5
dykstra_max_iter = 30
dykstra_tol = 1e-7
ic_multiplier = 1.0
threshold_multiplier = 1.0
ic_sensitivity_multipliers = [0.5, 2.0]
threshold_sensitivity_multipliers = [0.5, 2.0]
compute_rank_sensitivities = false

[inference]
targets = []
