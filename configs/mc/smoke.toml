[run]
name = "smoke"
master_seed = 20260808
dgps = [1, 2, 3, 4]
cells = [[20, 20]]
replications = 2
chunk_size = 2
parallel_level = "replications"
n_jobs = 1
blas_threads = 1
output_root = "results/mc"

[dgp]
calibration_draws = 1
group_gap_pilot_draws = 2
target_r2 = 0.70 # Feasible pipeline check; production retains the manuscript's 0.50 target.
auto_adjust_group_gap = false
min_abs_postscale_group_diff_a = 0.05
prespecified_gap_grid = [0.2, 0.3, 0.4, 0.5]

[estimation]
rank_caps = [3, 3, 3]
larger_rank_caps = [4, 4, 4]
coefficient_bound = 9.0
simulation_interior_margin = 1.0
max_sweeps = 300
objective_rtol = 1e-5
stationarity_tol = 0.05
start_objective_stability_tol = 1e-5
nuclear_gamma = 0.8
nuclear_epsilon = 0.64
nuclear_max_iter = 40
nuclear_tol = 1e-5
dykstra_max_iter = 30
dykstra_tol = 1e-7
ic_multiplier = 0.00005
compute_rank_sensitivities = false

[inference]
riesz_tol = 1e-6
riesz_max_iter = 300
targets = ["A_fixed_time_mean", "A_full_mean"]
